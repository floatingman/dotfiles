# ClinePass — Cline's subscription API (OpenAI-compatible chat completions)
# Key is read from CLINE_API_KEY (resolved from ~/.omp/agent/.env or shell env).
# Model IDs use Cline's full slug (cline-pass/<model>) as required by the API.
providers:
  clinepass:
    baseUrl: https://api.cline.bot/api/v1
    api: openai-completions
    apiKey: CLINE_API_KEY
    authHeader: true
    compat:
      supportsDeveloperRole: false # ClinePass rejects the `developer` role
      reasoningContentField: reasoning # reasoning streams in delta.reasoning
    models:
      - id: cline-pass/glm-5.2
        name: GLM-5.2
        reasoning: true
        input: [text]
        contextWindow: 200000
        maxTokens: 131072
        cost: { input: 1.4, output: 4.4, cacheRead: 0.26, cacheWrite: 0 }
        compat:
          reasoningEffortMap: { minimal: none }
      - id: cline-pass/kimi-k2.7-code
        name: Kimi K2.7 Code
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 131072
        cost: { input: 0.95, output: 4.0, cacheRead: 0.19, cacheWrite: 0 }
        compat:
          reasoningEffortMap: { minimal: low, xhigh: high }
      - id: cline-pass/kimi-k2.6
        name: Kimi K2.6
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 131072
        cost: { input: 0.95, output: 4.0, cacheRead: 0.16, cacheWrite: 0 }
        compat:
          reasoningEffortMap: { minimal: low, xhigh: high }
      - id: cline-pass/kimi-k3
        name: Kimi K3
        reasoning: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 131072
        cost: { input: 3.0, output: 15.0, cacheRead: 0.3, cacheWrite: 0 }
        compat:
          # K3 always reasons and only accepts reasoning_effort=max
          reasoningEffortMap: { minimal: max, low: max, medium: max, high: max, xhigh: max }
      - id: cline-pass/deepseek-v4-pro
        name: DeepSeek V4 Pro
        reasoning: true
        input: [text]
        contextWindow: 1000000
        maxTokens: 384000
        cost: { input: 1.74, output: 3.48, cacheRead: 0.0145, cacheWrite: 0 }
        compat:
          # only off and high are supported; clamp other levels
          reasoningEffortMap: { minimal: none, low: high, medium: high }
      - id: cline-pass/deepseek-v4-flash
        name: DeepSeek V4 Flash
        reasoning: true
        input: [text]
        contextWindow: 1000000
        maxTokens: 384000
        cost: { input: 0.14, output: 0.28, cacheRead: 0.0028, cacheWrite: 0 }
        compat:
          reasoningEffortMap: { minimal: none, low: high, medium: high }
      - id: cline-pass/mimo-v2.5
        name: MiMo-V2.5
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 131072
        cost: { input: 0.14, output: 0.28, cacheRead: 0.0028, cacheWrite: 0 }
        compat:
          reasoningEffortMap: { minimal: none, xhigh: high }
      - id: cline-pass/mimo-v2.5-pro
        name: MiMo-V2.5-Pro
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 131072
        cost: { input: 1.74, output: 3.48, cacheRead: 0.0145, cacheWrite: 0 }
        compat:
          reasoningEffortMap: { minimal: none, xhigh: high }
      - id: cline-pass/minimax-m3
        name: MiniMax M3
        reasoning: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 131072
        cost: { input: 0.3, output: 1.2, cacheRead: 0.06, cacheWrite: 0 }
        compat:
          reasoningEffortMap: { minimal: none, xhigh: high }
      - id: cline-pass/qwen3.7-max
        name: Qwen3.7 Max
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 131072
        cost: { input: 2.5, output: 7.5, cacheRead: 0.5, cacheWrite: 3.125 }
        compat:
          reasoningEffortMap: { minimal: none, xhigh: high }
      - id: cline-pass/qwen3.7-plus
        name: Qwen3.7 Plus
        reasoning: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 131072
        cost: { input: 0.4, output: 1.6, cacheRead: 0.04, cacheWrite: 0.5 }
        compat:
          reasoningEffortMap: { minimal: none, xhigh: high }
