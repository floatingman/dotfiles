[cmd_duration]
min_time = 1_000
# style = "bold dimmed yellow"
# format = '◷[$duration]($style) '
format = '\[[⏱ $duration]($style)\]'

[shell]
fish_indicator = '󰈺'
powershell_indicator = '_'
bash_indicator = '\$'
zsh_indicator = 'λ'
unknown_indicator = '?'
disabled = false
format = '$indicator '

[status]
