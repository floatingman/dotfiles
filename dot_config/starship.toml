# Inserts a blank line between shell prompts
add_newline = true

# format = '''[╭── $os \([$username@$hostname](bold blue)\)-\[$directory\]-($kubernetes)(-$git_branch$git_metrics$git_status)(-$nix_shell)](blue) $cmd_duration
# [╰─](blue)[$shell](bold blue) '''

# A minimal left prompt
# format = """$directory$character"""
# format = """$os $username@$hostname $kubernetes $directory $git_branch $git_status """
palette = "gruvbox_dark"
# move the rest of the prompt to the right
right_format = '$status$claude'
command_timeout = 1000

# [directory]
# truncation_length = 3
# truncation_symbol = '…/'
# truncate_to_repo = true
# style = 'bold white'
# format = '[$path]($style)[$read_only]($read_only_style)'

# Shows current directory
[directory]
truncation_length = 3
truncation_symbol = '…/'
home_symbol = '󰋜 ~'
read_only_style = '197'
read_only = '  '
format = '[$path]($style)[$read_only]($read_only_style)'

[character]
# success_symbol = '[λ](bold blue)'
# error_symbol = '[λ](bold red)'
success_symbol = '[❯](bold blue)'
error_symbol = '[❯](bold red)'
# Drop ugly default prompt characters
# [character]
# success_symbol = ''
# error_symbol = ''

[os]
# format = '[$symbol](bold white) '   
# format = '\[[$symbol]($style)\]'
format = '[$symbol]($style) '
disabled = false

[os.symbols]
Windows = ' '
Arch = '󰣇'
Ubuntu = ''
Macos = '󰀵'

# Shows the username
[username]
# style_user = 'white bold'
# style_root = 'red bold'
# format = '[$user]($style) '
# format = '\[[$user]($style)\]'
# format = '$user($style)'
disabled = false
show_always = true

# Shows the hostname
[hostname]
ssh_only = false
# format = ' on [$hostname](bold yellow) '
# format = '[$ssh_symbol](bold blue)$hostname'
disabled = false

# Shows current git branch
[git_branch]
# style = 'bold green'
symbol = ''
# format = '[$symbol$branch(hello$banch)](bold green)'
format = '\[[$symbol$branch]($style)\]'
# symbol = ' '
# format = 'via [$symbol$branch]($style)'
# truncation_length = 4
# truncation_symbol = '…/'
# style = 'bold green'

# Shows current git status
# [git_status]
# modified = '[✘](bold red)'
# up_to_date = 'up'
# format = '$up_to_date$modified$up_to_date'
[git_status]
# format = '([ \( $all_status$ahead_behind\)]($style) )'
format = '([\[$all_status$ahead_behind\]]($style))'
# style = 'bold green'
conflicted = '[ confliced=${count}](red)'
up_to_date = '[󰘽 up-to-date](green)'
untracked = '[󰋗 untracked=${count}](red)'
ahead = ' ahead=${count}'
diverged = ' ahead=${ahead_count}  behind=${behind_count}'
behind = ' behind=${count}'
stashed = '[ stashed=${count}](green)'
modified = '[󰛿 modified=${count}](yellow)'
staged = '[󰐗 staged=${count}](green)'
renamed = '[󱍸 renamed=${count}](yellow)'
deleted = '[󰍶 deleted=${count}](red)'

# [aws]
# format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
# disabled = false
# style = 'bold blue'
# symbol = "  "
#
# [golang]
# format = '[ ](bold cyan)'

[kubernetes]
symbol = '☸ '
disabled = false
detect_files = ['Dockerfile']
# format = '[$context(\[$namespace\])]($style) '
format = '\[[$symbol$context( \($namespace\))]($style)\]'

