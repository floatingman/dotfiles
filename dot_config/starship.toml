# Custom Claude Code provider module
[custom.claude]
description = "Show current Claude Code provider"
symbol = "🤖 "
style = "bold purple"
format = " [$symbol$output]($style)"
shell = ["sh", "-c"]
command = "if [ \"$CLAUDE_PROVIDER\" = \"zai\" ]; then echo \"z.ai\"; elif [ \"$CLAUDE_PROVIDER\" = \"anthropic\" ]; then echo \"Anthropic\"; fi"

